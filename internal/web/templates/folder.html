{{define "content"}}
<div class="grid gap-4">
  {{- if .Empty}}
  {{template "empty"}}
  {{- else}}
  {{- if .Recent}}<section class="grid gap-2"><h2 class="text-sm font-semibold">Recently changed</h2>{{template "entries" .Recent}}</section>{{end}}
  {{- if or .Folders .Documents}}{{template "entries" .Folders}}{{template "entries" .Documents}}{{end}}
  {{- end}}
</div>
{{end}}
