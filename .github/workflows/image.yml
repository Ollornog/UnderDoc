name: image

# Every state on main becomes a container image, ghcr.io/ollornog/underdoc:main-<first 12 hex of the commit>, for
# amd64 and arm64. A deployment pins it by tag and digest instead of building the image itself from a copy of the source.
# Before pushing, the same check as in the CI (scripts/check-image.sh) has to pass. workflow_dispatch is the dry run: on
# any other branch it builds both platforms and pushes nothing; on main it publishes like a push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-latest   # public repository, so never self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write        # only this job pushes, and only from main (steps below)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check the image (hardened start, gate, content)
        run: scripts/check-image.sh

      - name: Tag
        id: tag
        run: echo "tag=main-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      # No QEMU: nothing in the Dockerfile runs on the target platform (the build stage cross-compiles).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          version: v0.37.1
          cache-binary: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (amd64 + arm64), push only from main
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/ollornog/underdoc:${{ steps.tag.outputs.tag }}

      # Published is only what the registry knows under the digest, with both platforms.
      - name: Read the platforms back
        if: github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::no digest from the build"; exit 1; }
          image="ghcr.io/ollornog/underdoc"
          docker buildx imagetools inspect "$image@$DIGEST" | tee "$RUNNER_TEMP/image.txt"
          for platform in linux/amd64 linux/arm64; do
            grep -q "Platform: *$platform\$" "$RUNNER_TEMP/image.txt" || { echo "::error::$platform is missing"; exit 1; }
          done
          printf '### Image\n\n%s:%s@%s (amd64, arm64)\n' "$image" "$TAG" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
