version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    # The pins of the auto-merge workflow belong to the kit and arrive with its sync.
    ignore:
      - dependency-name: "actions/create-github-app-token"
    groups:
      minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  - package-ecosystem: gomod
    directory: /
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # The check tools (staticcheck, govulncheck). Without this entry the pin would age silently.
  - package-ecosystem: gomod
    directory: /.github/audit
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # The web editor (ADR-21). scripts/build-js.sh builds and tests the bundle from the lockfile in the checks, so an update
  # merges by itself when they are green.
  - package-ecosystem: npm
    directory: /web/editor
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # The PDF preview (ADR-28): pdf.js, copied from the lockfile into the assets by scripts/build-js.sh.
  - package-ecosystem: npm
    directory: /web/pdfjs
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # The text of images in the browser (ADR-24): Tesseract.js and its language data, copied from the lockfile into the
  # assets by scripts/build-js.sh.
  - package-ecosystem: npm
    directory: /web/tesseract
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # The base images of the Dockerfile. scripts/check-image.sh in the CI accepts them.
  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
  # The search engines the tests run against (scripts/search/Dockerfile.*); the search tests in the CI accept them.
  - package-ecosystem: docker
    directory: /scripts/search
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
  # The Samba companion (deploy/samba/Dockerfile, ADR-30). scripts/check-samba.sh in the CI accepts it against real
  # Samba. The Samba package itself is pinned by version in the Dockerfile and moved by hand with its base.
  - package-ecosystem: docker
    directory: /deploy/samba
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
  # LibreOffice for the measurement of T-1 (scripts/t1/Dockerfile.libreoffice): run by hand, nothing in the CI starts it.
  - package-ecosystem: docker
    directory: /scripts/t1
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
  # The services next to UnderDoc (deploy/compose.yml). scripts/check-services.sh accepts Meilisearch (the upgrade of a
  # filled database) and Gotenberg (a conversion); Mailpit has no test, so this ecosystem is not in the auto-merge and an
  # update is looked at by hand. The search engines are left out here: they follow the pins of scripts/search, which
  # tests/test_repo.py holds them to, so one update moves them everywhere.
  - package-ecosystem: docker-compose
    directory: /deploy
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "getmeili/meilisearch"
      - dependency-name: "opensearchproject/opensearch"
