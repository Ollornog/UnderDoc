version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    # The pins of the auto-merge workflow belong to the kit and arrive with its sync.
    ignore:
      - dependency-name: "actions/create-github-app-token"
    groups:
      minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  - package-ecosystem: gomod
    directory: /
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # The check tools (staticcheck, govulncheck). Without this entry the pin would age silently.
  - package-ecosystem: gomod
    directory: /.github/audit
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
