version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    # The pins of the auto-merge workflow belong to the kit and arrive with its sync.
    ignore:
      - dependency-name: "actions/create-github-app-token"
    groups:
      minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  - package-ecosystem: gomod
    directory: /
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # The check tools (staticcheck, govulncheck). Without this entry the pin would age silently.
  - package-ecosystem: gomod
    directory: /.github/audit
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # The web editor (ADR-21). scripts/build-js.sh builds and tests the bundle from the lockfile in the checks, so an update
  # merges by itself when they are green.
  - package-ecosystem: npm
    directory: /web/editor
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # The PDF preview (ADR-28): pdf.js, copied from the lockfile into the assets by scripts/build-js.sh.
  - package-ecosystem: npm
    directory: /web/pdfjs
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # The base images of the Dockerfile. scripts/check-image.sh in the CI accepts them.
  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
